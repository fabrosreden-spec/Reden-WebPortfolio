<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #080d18;
    color: white;
}

header {
    background: #0c1424;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #203b5c;
}

.logo {
    color: white;
    font-size: 25px;
    font-weight: 800;
    text-decoration: none;
}

.logo span, h1 span, h2 span {
    color: #38aaff;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-size: 14px;
    transition: .3s;
}

nav a:hover {
    color: #38aaff;
}

.hero {
    min-height: 90vh;
    padding: 80px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
    background: radial-gradient(circle at 80% 40%, #12345a, #080d18 55%);
}

.hero-text {
    max-width: 600px;
}

.eyebrow {
    color: #38aaff;
    letter-spacing: 3px;
    font-size: 13px;
    font-weight: bold;
}

h1 {
    font-size: 45px;
    margin: 20px 0;
}

.hero h2 {
    font-size: 22px;
    margin-bottom: 15px;
}

.hero p {
    color: #b7c8dc;
    line-height: 1.8;
}

.button {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 25px;
    background: #168ee8;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    transition: .3s;
}

.button:hover {
    background: #0066b3;
    transform: translateY(-4px);
}

.hero-card {
    background: #101d30;
    border: 1px solid #287cc0;
    border-radius: 20px;
    padding: 35px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 30px #168ee833;
}

.photo-frame {
    width: 180px;
    height: 180px;
    margin: auto auto 20px;
    border-radius: 50%;
    padding: 5px;
    background: linear-gradient(135deg, #38aaff, #07539b);
    box-shadow: 0 0 25px #168ee899;
}

.photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.hero-card h3 {
    margin-bottom: 8px;
}

.tags {
    margin-top: 20px;
}

.tags span {
    display: inline-block;
    background: #173b5e;
    color: #8dccff;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    margin: 3px;
}

.section {
    padding: 80px 8%;
}

.section-dark {
    background: #0c1424;
}

.section-title {
    font-size: 35px;
    margin: 10px 0 30px;
}

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.panel {
    background: #111f33;
    border: 1px solid #243e5d;
    border-radius: 15px;
    padding: 25px;
    line-height: 1.8;
}

.panel h3 {
    margin-bottom: 15px;
    color: #38aaff;
}

.panel p {
    color: #bdcce0;
}

.details p {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 8px 0;
    border-bottom: 1px solid #263b53;
}

.details strong {
    color: white;
}

.details span {
    text-align: right;
}

.timeline {
    max-width: 800px;
    margin: auto;
}

.timeline .panel {
    margin-bottom: 20px;
}

.small-label {
    color: #38aaff !important;
    font-size: 12px;
    font-weight: bold;
}

.muted {
    color: #38aaff !important;
}

.skills-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.skill-card {
    background: #111f33;
    padding: 25px;
    border: 1px solid #243e5d;
    border-radius: 15px;
    transition: .3s;
}

.skill-card:hover {
    transform: translateY(-7px);
    border-color: #38aaff;
    box-shadow: 0 0 20px #168ee833;
}

.skill-icon {
    font-size: 30px;
    color: #38aaff;
    margin-bottom: 10px;
}

.skill-card h3 {
    margin-bottom: 8px;
}

.skill-card p {
    color: #aebed2;
    font-size: 14px;
}

pre {
    background: #050a12;
    padding: 20px;
    border-radius: 10px;
    overflow-x: auto;
    color: #75c5ff;
    margin: 20px 0;
}

.note {
    color: #38aaff !important;
    font-size: 13px;
}

footer {
    padding: 25px 8%;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    background: #070b13;
    color: #9aabc0;
}

footer a {
    color: #38aaff;
    text-decoration: none;
}

@media(max-width: 800px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        text-align: center;
    }

    nav a {
        display: inline-block;
        margin: 5px;
    }

    .hero {
        justify-content: center;
        text-align: center;
    }

    .about-grid {
        grid-template-columns: 1fr;
    }

    .skills-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 500px) {
    h1 {
        font-size: 32px;
    }

    .skills-grid {
        grid-template-columns: 1fr;
    }

    .details p {
        flex-direction: column;
    }

    .details span {
        text-align: left;
    }
}
</style>
